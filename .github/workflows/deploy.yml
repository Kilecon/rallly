name: CI Build, Push and Deploy

permissions:
  contents: write
  packages: write

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      release_url: ${{ steps.create_release.outputs.html_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get tag name
        id: vars
        run: |
          RAW_TAG=${GITHUB_REF#refs/tags/}
          CLEAN_TAG=$(printf '%s' "$RAW_TAG" | tr '+' '-')
          echo "tag=$CLEAN_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Private Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push
        id: build
        uses: docker/build-push-action@v5
        with:
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.tag }}
            SELF_HOSTED=true
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/rallly:${{ steps.vars.outputs.tag }}
            ${{ secrets.REGISTRY_URL }}/rallly:latest

      - name: Create Image Info File
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          IMAGE_TAG: ${{ steps.vars.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "### 🐳 Docker Image Information" > docker-info.txt
          echo "Registry: $REGISTRY_URL" >> docker-info.txt
          echo "Repository: rallly" >> docker-info.txt
          echo "Tag: $IMAGE_TAG" >> docker-info.txt
          echo "" >> docker-info.txt
          echo "### 🚀 How to pull this version:" >> docker-info.txt
          echo "docker login $REGISTRY_URL" >> docker-info.txt
          echo "docker pull $REGISTRY_URL/rallly:$IMAGE_TAG" >> docker-info.txt
          echo "" >> docker-info.txt
          echo "Image Digest: $IMAGE_DIGEST" >> docker-info.txt

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.vars.outputs.tag }}
          body: |
            ## 📦 Docker Image Available
            An official image for this release has been pushed to the private registry.

            **Pull command:**
            ```bash
            docker pull ${{ secrets.REGISTRY_URL }}/rallly:${{ steps.vars.outputs.tag }}
            ```
          generate_release_notes: true
          files: |
            docker-info.txt
          draft: false
          prerelease: false

  deploy-vps:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: always()
    steps:
      - name: Check Build Status
        if: needs.build-and-push.result != 'success'
        run: exit 1

      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          RALLLY_IMAGE: ${{ secrets.REGISTRY_URL }}/rallly:${{ needs.build-and-push.outputs.tag }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: VPS_APP_PATH,REGISTRY_URL,REGISTRY_USER,REGISTRY_PASSWORD,RALLLY_IMAGE
          command_timeout: 10m
          script: |
            set -eu
            cd "$VPS_APP_PATH"
            printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY_URL" -u "$REGISTRY_USER" --password-stdin
            docker compose -f docker-compose.vps.yml pull rally
            docker compose -f docker-compose.vps.yml up -d --wait --wait-timeout 300 rally

      - name: 🔔 Discord Final Notification
        if: always()
        env:
          DEPLOY_STATUS: ${{ job.status }}
          BUILD_STATUS: ${{ needs.build-and-push.result }}
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.tag }}
          RELEASE_URL: ${{ needs.build-and-push.outputs.release_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "$DEPLOY_STATUS" = "success" ]; then
            MESSAGE=$(printf '🚀 **Rallly - Déploiement réussi !**\n\nImage : `%s/rallly:%s`\n[Release GitHub](%s)\n\nConteneur démarré et vérifié sain ✅\n[Logs GitHub Actions](%s)' "$REGISTRY_URL" "$IMAGE_TAG" "$RELEASE_URL" "$RUN_URL")
          else
            MESSAGE=$(printf '❌ **Échec du pipeline Rallly !**\n\nBuild/publication/release : %s\nDéploiement : %s\nTag : `%s`\nCommit : `%s`\n\n[Logs GitHub Actions](%s)' "$BUILD_STATUS" "$DEPLOY_STATUS" "$IMAGE_TAG" "$COMMIT_SHA" "$RUN_URL")
          fi
          jq -n --arg content "$MESSAGE" '{username: "Mizu Registry", content: $content}' > discord-payload.json
          curl --fail-with-body --show-error --silent --connect-timeout 10 --max-time 30 \
            -H "Content-Type: application/json" -X POST \
            --data-binary @discord-payload.json "$DISCORD_WEBHOOK_URL"
