services:
  rallly_db:
    image: postgres:18-alpine
    restart: always
    ports:
      - "127.0.0.1:5450:5432"
    volumes:
      - db-data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      - POSTGRES_DB=rallly
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rallly_selfhosted:
    build:
      args:
        - SELF_HOSTED=true
      context: .
      dockerfile: ./apps/web/Dockerfile
    restart: always
    depends_on:
      rallly_db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - DATABASE_URL=postgres://postgres:${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}@rallly_db/rallly
    env_file:
      - path: apps/web/.env
        required: false

volumes:
  db-data:
    driver: local
