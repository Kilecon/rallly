services:
  rally:
    env_file:
    - .env
    image: registry.mizury.fr/rallly:latest
    networks:
      - proxy-network
      - rallly-garage-network
      - rallly-mailpit-network
      - rallly-redis-http-network
      - rallly-db-network

  rallly_db:
    image: postgres:18-alpine
    restart: always
    ports:
      - "5450:5432"
    volumes:
      - db-data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rallly-db-network 
  redis:
    image: redis:7.4-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - redis-network
  serverless-redis-http:
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8079:80"
    image: hiett/serverless-redis-http:latest
    environment:
      SRH_MODE: ${SRH_MODE}
      SRH_TOKEN: ${SRH_TOKEN}
      SRH_CONNECTION_STRING: ${SRH_CONNECTION_STRING}
    networks:
      - redis-network
      - rallly-redis-http-network
  garage:
    image: dxflrs/garage:v2.3.0
    restart: always
    ports:
      - "3900:3900"
      - "3903:3903"
    volumes:
      - ./docker/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    environment:
      - GARAGE_DEFAULT_ACCESS_KEY=${S3_ACCESS_KEY_ID}
      - GARAGE_DEFAULT_SECRET_KEY=${S3_SECRET_ACCESS_KEY}
      - GARAGE_DEFAULT_BUCKET=${S3_BUCKET_NAME}
    command: /garage server --single-node --default-bucket
    healthcheck:
      test: ["CMD", "/garage", "stats", "-a"]
      interval: 1h
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 5s
    networks:
      - rallly-garage-network
  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:8025:8025"
      - "1025:1025"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks :
      - rallly-mailpit-network
      - proxy-network

  garage_init:
    image: amazon/aws-cli
    depends_on:
      garage:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
    volumes:
      - ./docker/cors.json:/cors.json:ro
    entrypoint: ["sh", "-c", "aws --endpoint-url http://garage:3900 s3api put-bucket-cors --bucket rallly --cors-configuration file:///cors.json"]
    restart: "no"
    networks:
      - rallly-garage-network

  # Authentik: OIDC identity provider. Not published on the host: the reverse
  # proxy reaches it as authentik_server:9000 over proxy-network.
  authentik_db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - authentik-db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_PG_PASS}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d authentik -U authentik"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - authentication-network
  authentik_server:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.8.3}
    command: server
    restart: unless-stopped
    shm_size: 512mb
    depends_on:
      authentik_db:
        condition: service_healthy
    volumes:
      - authentik-data:/data
      - authentik-templates:/templates
    environment: &authentik-env
      AUTHENTIK_POSTGRESQL__HOST: authentik_db
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_PG_PASS}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
    networks:
      - authentication-network
      - proxy-network
  # No docker.sock and no root here, unlike the dev compose: it is only needed
  # for managed Docker outposts and would give a compromised worker the host.
  authentik_worker:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.8.3}
    command: worker
    restart: unless-stopped
    shm_size: 512mb
    depends_on:
      authentik_db:
        condition: service_healthy
    volumes:
      - authentik-data:/data
      - authentik-certs:/certs
      - authentik-templates:/templates
    environment: *authentik-env
    networks:
      - authentication-network

volumes:
  db-data:
    driver: local
  redis-data:
    driver: local
  garage-meta:
    driver: local
  garage-data:
    driver: local
  authentik-db:
    driver: local
  authentik-data:
    driver: local
  authentik-certs:
    driver: local
  authentik-templates:
    driver: local

networks:
  proxy-network:
    external: true
  rallly-db-network:
    driver: bridge
  redis-network:
    driver: bridge
  authentication-network:
    driver: bridge
  rallly-redis-http-network:
    driver: bridge
  rallly-garage-network:
    driver: bridge
  rallly-mailpit-network:
    driver: bridge